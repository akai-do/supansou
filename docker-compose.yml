# DuPanSou-Archive 一键全栈：PanSou 搜索引擎 + 本项目后端
# 用法：docker compose up -d，然后打开 http://localhost:5000
services:

  pansou:
    image: ghcr.io/fish2018/pansou:latest
    container_name: pansou
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      PORT: 8888
      AUTH_ENABLED: "false"
      CACHE_ENABLED: "true"
      # ⚠️ 必须单行、逗号后不能有空格：YAML 折行（>-）会在换行处插入空格，
      # PanSou 不 trim，会把 " peccxinpd" 当成频道名 → 请求 /s/%20peccxinpd
      # 必然失败。2026-10-20 实测 110 个频道里有 17 个带前导空格。
      CHANNELS: "tgsearchers7,Aliyun_4K_Movies,yunpanx,yp123pan,yunpanxunlei,tianyifc,peccxinpd,gotopan,PanjClub,baicaoZY,MCPH02,MCPH03,bdwpzhpd,Q66Share,ucwpzy,shareAliyun,Quark_Movies,XiangxiuNBB,ucquark,xx123pan,yingshifenxiang123,zyfb123,Lsp115,taoxgzy,Channel_Shares_115,vip115hot,wp123zy,yunpan139,yunpan189,yunpanuc,yydf_hzl,leoziyuan,yoyokuakeduanju,TG654TG,QukanMovie,yeqingjie_GJG666,movielover8888_film3,Baidu_netdisk,D_wusun,FLMdongtianfudi,KaiPanshare,rjyxfx,PikPak_Share_Channel,newproductsourcing,QuarkFree,yunpanNB,kkdj001,xxzlzn,pxyunpanxunlei,jxwpzy,kuakedongman,xiangnikanj,solidsexydoll,guoman4K,zdqxm,kduanju,cilidianying,CBduanju,SharePanFilms,dzsgx,BooksRealm,douerpan,Netdisk_Movies,yunpanquark,ciliziyuanku,jzmm_123pan,wpan8,mqte5,regengguangya,regeng115,regeng123,yy80986098,pan_guangya,guangyapan_episode,guangya_hdhive,guangyapindao,quark_res,domgmingapk,dianying4k,tgbokee,ucshare,gokuapan,WFYSFX03,gimy100,gimy115iso,fcij5,xvth5,xuexiziliaobaibaoku,phzvip,jdbigdiscount,youxigs,zhoulanziyuan,seedhub_pro,jnjy_5,xxziliao,wpzyk,ruanjianfenxiang77,jpnd5,XunLeiPinDao,a123fxme,WPpindao,kuyupan,djya5,zh_vip,gdsharing,guangyaya2026,alyp_17362,baidyunpan,yunpans,rbzhwpzy"
      # 同上：插件名也必须单行无空格（7 个插件受折行空格影响）
      ENABLED_PLUGINS: "dyyjpro,duoduo,djgou,feikuai,gaoqing888,gying,hdmoli,haitunsou,hunhepan,ikantv,jutoushe,kkv,dy4k,libvio,lingjisp,lou1,melost,meitizy,miosou,nyaa,ouge,panlian,pansearch,qqpd,quark4k,quarksoo,quarktv,qupanshe,sousou,thepiratebay,ting77,wanou,weibo,xb6v,xiaokupan,xiaozhang,xiaoyu,yingso,yulinshufa,yunso,yunsou,zlxapp,zxzj,rrbt,quarkres,diduan,erxiao,huban,labi,muou,shandian,zhizhen,clxiong,cyg,jsnoteclub,duanjuw,dyyj,nsgame,cldi,clmao,susu,u3c3,5266ys,dygang,leso,btbtlb,aipan,sopanya"
    # PanSou 开启认证时（AUTH_ENABLED=true），取消注释并设置：
    #   AUTH_ENABLED: "true"
    #   AUTH_USERNAME: admin
    #   AUTH_PASSWORD: 你的密码
    # 并在后端 environment 中设置 PANSOU_USERNAME / PANSOU_PASSWORD。

  backend:
    build: ./backend
    container_name: dupansou-backend
    restart: unless-stopped
    depends_on:
      - pansou
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      PORT: "5000"
      # 容器内必须监听 0.0.0.0 才能被宿主机访问
      HOST: 0.0.0.0
      DEBUG: "0"
      # 来源统计按“天”聚合，必须与站长本地日期一致（容器默认 UTC）
      TZ: Asia/Shanghai
      PANSOU_BASE_URL: http://pansou:8888
      # 站长令牌：远程/容器内访问时用它登录站长身份（页面「站长身份」里填同一个值）
      ACCEL_TOKEN: "XQhvYFcjvHhjkRv5Jt1I6oN0OLV5lkmN"
      # 访客（所有人）可用的加速端点：解析/列目录/直链/配额
      ACCEL_GUEST: "1"
      # 每个访客 IP 每天可用次数
      ACCEL_GUEST_DAILY: "50"
      # PANSOU_USERNAME: admin
      # PANSOU_PASSWORD: 你的密码
    volumes:
      # 索引库持久化：重建容器不丢积累的索引
      - backend-data:/app/data
      # 前端静态文件：构建上下文只有 backend/，镜像内不含 frontend/dist，需从宿主机挂载
      - ./frontend/dist:/frontend/dist:ro
      # 下载产物落到宿主机的 downloads/，重建容器不丢
      - ./downloads:/downloads

volumes:
  backend-data:
