<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0071e3" />
  <title>SuPanSou · 网盘资源聚合搜索</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // 非本机/内网地址强制走 HTTPS：部分 VPN 与内置 WebView 不会自动升级 http 链接
    try {
      var host = location.hostname || ''
      var isLocal = /^(localhost|127\.0\.0\.1|\[::1\]|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host)
      if (location.protocol === 'http:' && !isLocal) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash)
      }
    } catch (e) { }
  </script>
  <script>
    // 防闪烁：CSS 加载前先按本地偏好挂暗色类
    try {
      var t = localStorage.getItem('dps-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      if (t === 'dark') document.documentElement.classList.add('dark')
    } catch (e) { }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
